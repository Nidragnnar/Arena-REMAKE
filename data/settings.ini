# Configurações do Arena Remake

[Game]
# Pasta ARENA do jogo original (onde ficam GLOBAL.BSA e ACD.EXE).
# Se vazio, o remake procura nos locais padrão da Steam.
ArenaPath=

[Video]
# gpu = placa de vídeo (OpenGL 3.3; volta sozinho para cpu se não houver) | cpu = software
Renderer=gpu
# Resolução da cena 3D na GPU em relação à janela (1.0 = nativa, ex.: Full HD inteiro)
GpuRenderScale=1.0
Fullscreen=0
VSync=1
# sharp (recomendado), nearest ou linear
Filter=sharp
# Escala da resolução 3D no renderizador por software (0.2 a 1.0). Menor = mais rápido.
RenderScale=0.6
WindowWidth=1280
WindowHeight=960

[Graphics]
# Efeitos modernos do renderizador 3D (1 liga, 0 desliga). --classico desliga todos
# e volta ao visual pixelado original.
# Texturas ampliadas 4x com grão de detalhe e filtro suave (0 = pixels originais)
HDTextures=1
# Relevo nas paredes, pisos e tetos (precisa de HDTextures e ModernLighting)
Relief=1
# Luz difusa conforme a direção das superfícies
ModernLighting=1
# Cantos e encontros de parede/chão escurecidos
AmbientOcclusion=1
# Reflexos na água
Reflections=1
# Brilho em chamas, lava e pontos muito claros
Bloom=1
# Bordas da tela levemente escurecidas
Vignette=1

[Audio]
# Volumes de 0.0 a 1.0. A música usa o sintetizador MIDI do Windows.
SoundVolume=0.8
MusicVolume=0.6

[Controls]
# Teclas do teclado por ação (uma letra ou número). Ex.: Forward=Z troca o W pelo Z.
Forward=W
Back=S
StrafeLeft=A
StrafeRight=D
Attack=F
Use=E
Cast=Q
Rest=R
Character=C
Inventory=I
Spellbook=B
Map=M
Travel=T
Journal=J
Help=H
# Controle de videogame: analógico esquerdo anda, direito olha; RT ataca, LT conjura, A confirma,
# B volta, X usa, Y diário, LB ficha, RB descansa, Back viagem, Start pausa, direcional = setas.
Gamepad=1
GamepadLookSpeed=1.0
